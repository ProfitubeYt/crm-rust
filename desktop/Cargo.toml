[workspace]
resolver = "3"
members = ["crates/tbs-core", "crates/tbs-app"]

[workspace.package]
version = "2.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls", "query", "http2", "charset", "stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tracing = "0.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
